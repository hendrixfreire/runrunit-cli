name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Install package and installer dependency
        run: python -m pip install . uv
      - name: Unit tests
        run: python -m unittest discover -s . -p 'test*.py'
      - name: Console entrypoint
        run: rr --help
      - name: Configuration help
        run: rr configurar --help
      - name: POSIX installer in isolated directories
        if: runner.os != 'Windows'
        shell: bash
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/rr-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/rr-bin
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/rr-python
        run: sh ./install.sh --source "$PWD" --no-config
      - name: Windows installer in isolated directories
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/rr-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/rr-bin
          UV_PYTHON_INSTALL_DIR: ${{ runner.temp }}/rr-python
        run: ./install.ps1 -Source (Get-Location).Path -NoConfig
